<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preload" href="{{ '/assets/fonts/dm-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/newsreader-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <aside class="profile" aria-label="Profile">
        {% if site.avatar %}
          <a class="profile__photo-link" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
            <img class="profile__photo" src="{{ site.avatar | relative_url }}" alt="{{ site.title | escape }}" width="168" height="210" fetchpriority="high">
          </a>
        {% endif %}
        <div class="profile__identity">
          <h1>{{ site.title | escape }}</h1>
          <p class="profile__native" lang="zh">{{ site.native_name | escape }}</p>
          <div class="profile__details">
            <p class="profile__role">{{ site.position | escape }}</p>
            <p>{{ site.affiliation | escape }}</p>
            <p class="profile__location">{{ site.location | escape }}</p>
          </div>
        </div>
        <div class="profile__contact">
          <a class="profile__email" href="mailto:{{ site.email }}">{{ site.email_display | default: site.email | escape }}</a>
          <div class="profile__links" aria-label="External links">
            <a href="{{ site.github_url | escape }}" target="_blank" rel="noopener noreferrer">GitHub<span class="link-arrow" aria-hidden="true">↗</span></a>
            <a href="{{ site.cv_url | relative_url }}" target="_blank" rel="noopener noreferrer">CV<span class="link-arrow" aria-hidden="true">↗</span></a>
          </div>
        </div>
      </aside>
      <main class="content-column" id="main" tabindex="-1">
        {{ content }}
      </main>
    </div>
  </body>
</html>
